name: Build iPadSVN App

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'iPadSVN/**'
      - 'vendor/**'
      - 'scripts/**'
      - '.github/workflows/build-ipadsvn-app.yml'
  pull_request:
    paths:
      - 'iPadSVN/**'
      - 'scripts/**'
      - '.github/workflows/build-ipadsvn-app.yml'

jobs:
  verify-libsvn:
    name: Build and verify libsvn
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew list scons >/dev/null 2>&1 || brew install scons
          brew list autoconf >/dev/null 2>&1 || brew install autoconf automake libtool pkg-config unzip
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build libsvn for iOS
        run: |
          chmod +x scripts/*.sh
          bash scripts/build-libsvn-ios.sh

      - name: Verify libsvn link
        run: bash scripts/verify-libsvn-link.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libsvn-xcframework
          path: build/output/libsvn.xcframework
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libsvn-build-logs
          path: |
            build/build-summary.txt
            build/build.log
            build/verify.log
          retention-days: 14
          if-no-files-found: ignore

  build-app:
    name: Build iPadSVN IPA
    needs: verify-libsvn
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download libsvn.xcframework
        uses: actions/download-artifact@v4
        with:
          name: libsvn-xcframework
          path: vendor

      - name: Build for iOS device
        run: |
          set -euo pipefail
          test -d vendor/libsvn.xcframework
          xcodebuild build \
            -project iPadSVN/iPadSVN.xcodeproj \
            -scheme iPadSVN \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData -path '*/Release-iphoneos/iPadSVN.app' -type d | head -1)"
          test -n "$APP_PATH"
          chmod +x scripts/package-ipa.sh
          bash scripts/package-ipa.sh "$APP_PATH" build/iPadSVN.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: iPadSVN-ipa
          path: build/iPadSVN.ipa
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "## 真实 iPadSVN（含 libsvn）" >> "$GITHUB_STEP_SUMMARY"
          echo "IPA 已生成，Artifacts 下载 iPadSVN-ipa，Sideloadly 安装。" >> "$GITHUB_STEP_SUMMARY"
