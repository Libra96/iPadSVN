name: Verify libsvn iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - 'verify/**'
      - '.github/workflows/verify-libsvn-ios.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'verify/**'
      - '.github/workflows/verify-libsvn-ios.yml'

jobs:
  build-libsvn-ios:
    name: Cross-compile libsvn for iOS
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew list scons >/dev/null 2>&1 || brew install scons
          brew list autoconf >/dev/null 2>&1 || brew install autoconf automake libtool pkg-config unzip
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build libsvn for iOS
        run: |
          chmod +x scripts/*.sh
          bash scripts/build-libsvn-ios.sh

      - name: Verify link test
        run: bash scripts/verify-libsvn-link.sh

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsvn-ios-xcframework
          path: |
            build/output/libsvn.xcframework
            build/build-summary.txt
            build/build.log
            build/verify.log
          retention-days: 14

      - name: Build result summary
        if: always()
        run: |
          echo "## libsvn iOS Build" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f build/build-summary.txt ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build/build-summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build did not complete. Check build.log in artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi
