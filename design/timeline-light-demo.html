<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPadSVN — Timeline 命令台 · 多仓库 + 文件浏览</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface-2: #f9f9fb;
      --grouped: #ffffff;
      --ink: #1c1c1e;
      --ink-2: #636366;
      --ink-3: #aeaeb2;
      --line: rgba(0, 0, 0, 0.06);
      --line-2: rgba(0, 0, 0, 0.1);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,.06);
      --accent: #007aff;
      --accent-soft: rgba(0, 122, 255, 0.1);
      --accent-ring: rgba(0, 122, 255, 0.35);
      --commit: #34c759;
      --commit-dark: #248a3d;
      --mod: #ff9500;
      --mod-bg: #fff8eb;
      --add: #34c759;
      --add-bg: #edfcef;
      --del: #ff3b30;
      --del-bg: #fff0ef;
      --folder: #007aff;
      --radius: 14px;
      --radius-sm: 10px;
      --font: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --touch: 44px;
    }

    body {
      font-family: var(--font);
      background: #e5e5ea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 32px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page-hint { text-align: center; margin-bottom: 16px; max-width: 560px; }
    .page-hint h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .page-hint p { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

    .ipad {
      width: min(1080px, 98vw);
      aspect-ratio: 1194 / 834;
      background: #1c1c1e;
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 24px 64px rgba(0,0,0,.15);
    }
    .app {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .status {
      height: 24px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      background: var(--bg);
      flex-shrink: 0;
    }

    /* 顶栏 */
    .topbar {
      min-height: var(--touch);
      padding: 6px 16px 6px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      z-index: 5;
    }
    .topbar-back {
      width: var(--touch);
      height: var(--touch);
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s var(--spring);
    }
    .topbar-back:active { transform: scale(0.92); background: var(--accent-soft); }
    .topbar-back.hidden { visibility: hidden; pointer-events: none; }
    .topbar-back svg { width: 22px; height: 22px; }

    .repo-picker {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      text-align: left;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 10px;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .repo-picker:active { background: var(--bg); }
    .repo-picker h2 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .repo-picker h2 svg { width: 14px; height: 14px; color: var(--ink-3); flex-shrink: 0; }
    .repo-picker p {
      font-size: 11px;
      color: var(--ink-3);
      font-family: var(--mono);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--add-bg);
      color: var(--commit-dark);
      flex-shrink: 0;
    }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--commit); }
    .pill.rev { background: var(--surface-2); color: var(--ink-2); font-family: var(--mono); font-weight: 500; }
    .pill.rev::before { display: none; }
    .pill.warn { background: var(--mod-bg); color: #c93400; }
    .pill.warn::before { background: var(--mod); }

    .body-row { flex: 1; display: flex; min-height: 0; }

    .rail {
      width: 64px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
      flex-shrink: 0;
    }
    .rail-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
      display: grid;
      place-items: center;
      position: relative;
      transition: background 0.15s var(--ease), color 0.15s, transform 0.1s var(--spring);
      -webkit-tap-highlight-color: transparent;
    }
    .rail-btn:active { transform: scale(0.92); }
    .rail-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: inset 3px 0 0 var(--accent);
      border-radius: 0 12px 12px 0;
    }
    .rail-btn svg { width: 22px; height: 22px; }
    .rail-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--mod);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .rail-spacer { flex: 1; }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .view.active { display: flex; }

    .hero {
      padding: 18px 24px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .hero h3 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    .hero h3 em { font-style: normal; color: var(--accent); }
    .hero p { font-size: 14px; color: var(--ink-2); margin-top: 6px; }

    /* —— 仓库列表 —— */
    .repo-grid {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      align-content: start;
    }
    .repo-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      cursor: pointer;
      text-align: left;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s var(--spring);
      -webkit-tap-highlight-color: transparent;
    }
    .repo-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #5ac8fa);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .repo-card.has-changes::before { opacity: 1; }
    .repo-card:active { transform: scale(0.98); }
    .repo-card:hover { border-color: rgba(0,122,255,.2); box-shadow: var(--shadow-md); }
    .repo-card .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      margin-bottom: 12px;
    }
    .repo-card .icon svg { width: 22px; height: 22px; }
    .repo-card h4 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
    .repo-card .url { font-size: 11px; color: var(--ink-3); font-family: var(--mono); margin-top: 4px; }
    .repo-card .meta {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .repo-card .chip {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--ink-2);
      font-family: var(--mono);
    }
    .repo-card .chip.changes { background: var(--mod-bg); color: #c93400; }
    .repo-card .sync-time { font-size: 11px; color: var(--ink-3); margin-top: 10px; }
    .add-repo {
      border: 2px dashed var(--line-2);
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      color: var(--accent);
    }
    .add-repo .icon { background: transparent; border: 2px solid var(--accent-soft); }
    .add-repo h4 { color: var(--accent); }

    /* —— 文件浏览 —— */
    .browse-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border-radius: 10px;
      padding: 0 12px;
      min-height: 36px;
      border: 1px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: var(--surface);
    }
    .search-box svg { width: 16px; height: 16px; color: var(--ink-3); flex-shrink: 0; }
    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      font-family: var(--font);
      outline: none;
      color: var(--ink);
    }
    .search-box input::placeholder { color: var(--ink-3); }
    .filter-chip {
      border: 1px solid var(--line-2);
      background: var(--surface);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: var(--font);
    }
    .filter-chip.active {
      background: var(--mod-bg);
      border-color: rgba(255,149,0,.35);
      color: #c93400;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .breadcrumb::-webkit-scrollbar { height: 0; }
    .crumb {
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font);
      transition: background 0.15s;
    }
    .crumb:last-child { color: var(--ink); font-weight: 600; pointer-events: none; }
    .crumb:not(:last-child):active { background: var(--accent-soft); }
    .crumb-sep { color: var(--ink-3); font-size: 12px; user-select: none; }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 100px;
      -webkit-overflow-scrolling: touch;
    }
    .file-list::-webkit-scrollbar { width: 0; }

    .list-section { margin-bottom: 20px; animation: fadeUp 0.3s var(--ease) both; }
    .list-section:nth-child(2) { animation-delay: 0.04s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0 4px 8px;
    }
    .list-group {
      background: var(--grouped);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .list-group .file-row:not(:last-child) {
      border-bottom: 1px solid var(--line);
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      min-height: var(--touch);
      cursor: pointer;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .file-row:active { background: var(--surface-2); }
    .file-row.selected { background: var(--accent-soft); }
    .file-row .mod-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--mod);
      flex-shrink: 0;
    }

    .fi {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .fi.folder { background: rgba(0,122,255,.12); color: var(--folder); }
    .fi.swift { background: linear-gradient(135deg, #ff9f0a, #ff6723); color: #fff; }
    .fi.plist { background: linear-gradient(135deg, #8e8e93, #636366); color: #fff; }
    .fi.objc { background: linear-gradient(135deg, #bf5af2, #8944ab); color: #fff; }
    .fi.json { background: linear-gradient(135deg, #30d158, #248a3d); color: #fff; }
    .fi.md { background: linear-gradient(135deg, #64d2ff, #007aff); color: #fff; }
    .fi.go { background: linear-gradient(135deg, #00c7be, #007aff); color: #fff; }
    .fi svg { width: 18px; height: 18px; }

    .file-row .info { flex: 1; min-width: 0; }
    .file-row .name { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
    .file-row .sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
    .file-row .chevron { color: var(--ink-3); flex-shrink: 0; }
    .file-row .chevron svg { width: 16px; height: 16px; }

    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: var(--mono);
      flex-shrink: 0;
    }
    .tag.M { background: var(--mod-bg); color: #c93400; }
    .tag.A { background: var(--add-bg); color: var(--commit-dark); }
    .tag.D { background: var(--del-bg); color: #d70015; }
    .tag-label { font-size: 10px; margin-left: 2px; opacity: 0.85; }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--ink-3);
    }
    .empty-state svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 15px; }

    .preview-backdrop {
      position: absolute;
      inset: 0;
      left: 64px;
      background: rgba(0,0,0,.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 14;
    }
    .preview-backdrop.open { opacity: 1; pointer-events: auto; }

    /* 文件预览浮层（主区内，非三栏） */
    .file-preview {
      position: absolute;
      bottom: 0;
      left: 64px;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -12px 40px rgba(0,0,0,.12);
      transform: translateY(100%);
      transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 15;
      max-height: 58%;
      display: flex;
      flex-direction: column;
    }
    .file-preview.open { transform: translateY(0); }
    .preview-grab {
      width: 36px; height: 5px;
      background: var(--line-2);
      border-radius: 3px;
      margin: 8px auto 0;
      flex-shrink: 0;
    }
    .preview-head {
      padding: 10px 20px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .preview-head .info { flex: 1; min-width: 0; }
    .preview-head .name { font-size: 16px; font-weight: 600; font-family: var(--mono); }
    .preview-head .path { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .preview-close {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--ink-2);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .preview-body {
      flex: 1;
      overflow: auto;
      padding: 0;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
      background: var(--surface-2);
    }
    .diff-line {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      padding: 1px 16px 1px 0;
    }
    .diff-line:hover { background: rgba(0,0,0,.02); }
    .diff-ln {
      text-align: right;
      color: var(--ink-3);
      user-select: none;
      padding-right: 4px;
      border-right: 1px solid var(--line);
    }
    .diff-line.a .diff-code { color: var(--commit-dark); background: rgba(52,199,89,.06); }
    .diff-line.d .diff-code { color: #d70015; background: rgba(255,59,48,.06); }
    .diff-line.ctx .diff-code { color: var(--ink-2); }
    .preview-meta {
      display: flex;
      gap: 12px;
      padding: 10px 20px;
      font-size: 12px;
      color: var(--ink-3);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .preview-meta span { display: flex; align-items: center; gap: 4px; }
    .preview-actions {
      padding: 12px 20px 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    .preview-actions button {
      flex: 1;
      min-height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      color: var(--ink-2);
      cursor: pointer;
    }
    .preview-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* —— Timeline 变更 —— */
    .stream-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 100px;
      -webkit-overflow-scrolling: touch;
    }
    .event {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 0 14px;
      margin-bottom: 2px;
      cursor: pointer;
    }
    .event-line { display: flex; flex-direction: column; align-items: center; padding-top: 18px; }
    .event-dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2.5px solid var(--line-2); background: var(--surface);
      transition: all 0.25s var(--ease);
    }
    .event.open .event-dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .event-vline { width: 2px; flex: 1; min-height: 12px; background: var(--line); margin-top: 4px; }
    .event:last-child .event-vline { display: none; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .event.open .card { border-color: rgba(0,122,255,.25); box-shadow: 0 4px 20px rgba(0,122,255,.08); }
    .card-head { display: flex; align-items: center; gap: 12px; }
    .card-info { flex: 1; min-width: 0; }
    .card-info .name { font-size: 16px; font-weight: 600; font-family: var(--mono); }
    .card-info .path { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .card-diff { max-height: 0; overflow: hidden; transition: max-height 0.4s, opacity 0.3s; opacity: 0; }
    .event.open .card-diff { max-height: 220px; opacity: 1; margin-top: 14px; overflow: auto; }
    .diff-box {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 0;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
      overflow: hidden;
    }

    /* —— 历史 —— */
    .history-list { flex: 1; overflow-y: auto; padding: 16px 20px 100px; }
    .hist-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 0 14px;
      margin-bottom: 4px;
    }
    .hist-line { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
    .hist-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--accent-soft);
    }
    .hist-vline { width: 2px; flex: 1; min-height: 20px; background: var(--line); margin-top: 4px; }
    .hist-item:last-child .hist-vline { display: none; }
    .hist-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
    }
    .hist-rev { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--accent); }
    .hist-body .msg { font-size: 15px; font-weight: 500; margin-top: 4px; }
    .hist-body .meta { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

    /* —— 设置 —— */
    .settings { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }
    .settings-group {
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .settings-row {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      min-height: var(--touch);
      border-bottom: 1px solid var(--line);
      font-size: 16px;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row span { flex: 1; }
    .settings-row .val { color: var(--ink-3); font-size: 15px; }

    /* 底部操作条 */
    .float-bar {
      position: absolute;
      bottom: 16px;
      left: 64px;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 20px;
      pointer-events: none;
      z-index: 10;
    }
    .float-inner {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(24px) saturate(180%);
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: 0 8px 32px rgba(0,0,0,.1);
    }
    .float-inner .hint { padding: 0 12px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
    .float-inner .hint b { color: var(--mod); font-weight: 700; }
    .float-btn {
      min-height: var(--touch);
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      background: transparent;
      color: var(--accent);
    }
    .float-btn.secondary { color: var(--ink-2); }
    .float-btn.primary { background: var(--commit); color: #fff; padding: 0 28px; }
    .float-sep { width: 1px; height: 24px; background: var(--line); }

    /* Sheet 通用 */
    .sheet-bg {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 20;
    }
    .sheet-bg.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      padding: 10px 24px 28px;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 30;
      max-height: 70%;
      overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-grab { width: 36px; height: 5px; background: var(--line-2); border-radius: 3px; margin: 0 auto 18px; }
    .sheet h4 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .sheet .sub { font-size: 14px; color: var(--ink-2); margin-bottom: 16px; }

    .repo-switch-item {

    .rs-icon {

      display: grid; place-items: center;
    }

    .rs-body { flex: 1; min-width: 0; }
    .rs-name { font-size: 16px; font-weight: 600; }
    .rs-url { font-size: 12px; color: var(--ink-3); font-family: var(--mono); margin-top: 2px; }

      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line);
      font-size: 16px; min-height: var(--touch);
    }
    .sheet-file input { width: 22px; height: 22px; accent-color: var(--accent); }
    .sheet textarea {
      width: 100%; min-height: 80px;
      border: 1px solid var(--line-2); border-radius: var(--radius-sm);
      padding: 14px 16px; font-family: var(--font); font-size: 16px;
      resize: none; outline: none; margin-bottom: 14px; background: var(--surface-2);

    .sheet-submit {
      width: 100%; min-height: 50px; border: none; border-radius: var(--radius-sm);
      background: var(--commit); color: #fff; font-size: 17px; font-weight: 600;
      font-family: var(--font); cursor: pointer;
    }

    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 14px 24px; background: var(--ink); color: #fff;
      border-radius: 14px; font-size: 15px; font-weight: 500;
      opacity: 0; pointer-events: none; transition: all 0.35s var(--spring); z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .syncing .pill::before { animation: pulse 0.8s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .foot-note { margin-top: 16px; text-align: center; font-size: 12px; color: var(--ink-2); max-width: 520px; line-height: 1.6; }
  </style>
</head>

    const TAG_LABELS = { M: '修改', A: '新增', D: '删除' };

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

    function tagHtml(status, showLabel) {
      if (!status) return '';
      const label = showLabel ? `<span class="tag-label">${TAG_LABELS[status] || status}</span>` : '';
      return `<span class="tag ${status}">${status}${label}</span>`;
    }

    function renderDiffLines(content, startLine) {
      let ln = startLine || 1;
      return (content || []).map(([t, l]) => {
        const num = t === 'add' || t === 'a' ? ln++ : t === 'del' || t === 'd' ? ln : ln++;
        const type = t === 'add' ? 'a' : t === 'del' ? 'd' : t;
        return `<div class="diff-line ${type}"><span class="diff-ln">${num}</span><span class="diff-code">${esc(l)}</span></div>`;
      }).join('');
    }

    function folderHasChanges(node) {
      if (!node) return false;
      if (node.type === 'file') return !!node.status;
      if (!node.children) return false;
      return Object.values(node.children).some(folderHasChanges);
    }

    function getRepo() { return REPOS[currentRepoId]; }

    function collectChanges(node, prefix, out) {
      if (!node) return;
      if (node.type === 'file' && node.status) {
        out.push({ path: prefix, name: prefix.split('/').pop(), ...node });
      } else if (node.type === 'folder' && node.children) {
        Object.entries(node.children).forEach(([name, child]) => {
          collectChanges(child, prefix ? prefix + '/' + name : name, out);
        });
      } else if (node.children) {
        Object.entries(node.children).forEach(([name, child]) => {
          collectChanges(child, name, out);
        });
      }
    }

    function getChanges(repo) {
      const out = [];
      collectChanges(repo.tree, '', out);
      return out;
    }

    function getNodeAtPath(repo, pathArr) {
      let node = repo.tree;
      for (const seg of pathArr) {
        if (!node.children || !node.children[seg]) return null;
        node = node.children[seg];
      }
      return node;
    }

      t.classList.add('show');

        sub.textContent = repo.url;
        sync.classList.remove('hidden');

        sync.className = 'pill';
        if (changes.length) {

          sync.className = 'pill warn';

        <div class="view ${currentView === 'repos' ? 'active' : ''}" id="view-repos">
          <div class="hero"><h3><em>${Object.keys(REPOS).length}</em> 个仓库</h3><p>轻点进入，浏览文件、提交变更</p></div>
          <div class="repo-grid">
            ${cards}
            <button class="repo-card add-repo" id="btnAddRepo">
              <div class="icon">${icons.repo.replace('stroke="currentColor"','stroke="currentColor"').replace('<svg','<svg')}</div>
              <h4>+ Checkout 新仓库</h4>
            </button>
          </div>
        </div>
        <div class="view ${currentView === 'settings' ? 'active' : ''}" id="view-settings-global">
          <div class="hero"><h3>设置</h3><p>账号与全局选项</p></div>
          <div class="settings">
            <div class="settings-group">
              <div class="settings-row"><span>SVN 服务器</span><span class="val">svn.company.com</span></div>
              <div class="settings-row"><span>用户名</span><span class="val">developer</span></div>
              <div class="settings-row"><span>默认分支</span><span class="val">trunk</span></div>
            </div>
            <div class="settings-group">
              <div class="settings-row"><span>Checkout 新仓库</span><span class="val">›</span></div>
              <div class="settings-row"><span>清除全部缓存</span><span class="val">›</span></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderBrowse() {
      const repo = getRepo();
      const node = getNodeAtPath(repo, browsePath);
      const crumbs = [{ label: repo.name, path: [] }];
      let acc = [];
      browsePath.forEach(seg => {
        acc = [...acc, seg];
        crumbs.push({ label: seg, path: [...acc] });
      });

      const q = browseSearch.trim().toLowerCase();
      let entries = node && node.children
        ? Object.entries(node.children).sort((a, b) => {
            if (a[1].type === 'folder' && b[1].type !== 'folder') return -1;
            if (a[1].type !== 'folder' && b[1].type === 'folder') return 1;
            return a[0].localeCompare(b[0]);
          })
        : [];

      if (q) entries = entries.filter(([name]) => name.toLowerCase().includes(q));
      if (browseFilterChanges) {
        entries = entries.filter(([, item]) =>
          item.type === 'file' ? item.status : folderHasChanges(item)
        );
      }

      const folders = entries.filter(([, i]) => i.type === 'folder');
      const files = entries.filter(([, i]) => i.type === 'file');

      function rowFolder(name, item) {
        const count = Object.keys(item.children || {}).length;
        const hasMod = folderHasChanges(item);
        return `
          <div class="file-row" data-action="folder" data-name="${esc(name)}">
            <div class="fi folder">${icons.folder}</div>
            <div class="info"><div class="name">${esc(name)}</div><div class="sub">${count} 项</div></div>
            ${hasMod ? '<span class="mod-dot" title="含变更"></span>' : ''}
            <span class="chevron">${icons.chevron}</span>
          </div>`;
      }

      function rowFile(name, item) {
        const fullPath = [...browsePath, name].join('/');
        const ext = item.ext || 'file';
        const icon = ext === 'swift' ? icons.swift : icons.file;
        return `
          <div class="file-row ${selectedFilePath === fullPath ? 'selected' : ''}" data-action="file" data-path="${esc(fullPath)}">
            <div class="fi ${ext}">${icon}</div>
            <div class="info"><div class="name">${esc(name)}</div><div class="sub">${item.size || ''}${item.mtime ? ' · ' + item.mtime : ''}</div></div>
            ${tagHtml(item.status, true)}
          </div>`;
      }

      let listHtml = '';
      if (!entries.length) {
        listHtml = `<div class="empty-state">${icons.folder}<p>${q || browseFilterChanges ? '没有匹配的文件' : '空文件夹'}</p></div>`;
      } else {
        if (folders.length) {
          listHtml += `<div class="list-section"><div class="section-label">文件夹</div><div class="list-group">${folders.map(([n,i]) => rowFolder(n,i)).join('')}</div></div>`;
        }
        if (files.length) {
          listHtml += `<div class="list-section"><div class="section-label">文件</div><div class="list-group">${files.map(([n,i]) => rowFile(n,i)).join('')}</div></div>`;
        }
      }

      return `
        <div class="view ${currentView === 'browse' ? 'active' : ''}" id="view-browse">
          <div class="browse-toolbar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="search" id="browseSearch" placeholder="搜索当前目录…" value="${esc(browseSearch)}" />
            </div>
            <button type="button" class="filter-chip ${browseFilterChanges ? 'active' : ''}" id="filterChanges">仅变更</button>
          </div>
          <div class="breadcrumb" id="breadcrumb">
            ${crumbs.map((c, i) => `
              ${i ? '<span class="crumb-sep">›</span>' : ''}
              <button type="button" class="crumb" data-path='${esc(JSON.stringify(c.path))}'>${esc(c.label)}</button>
            `).join('')}
          </div>
          <div class="file-list" id="fileList">${listHtml}</div>
        </div>
      `;
    }

    function renderChanges() {
      const repo = getRepo();
      const changes = getChanges(repo);
      const stream = changes.map((f, i) => {
        const dir = f.path.includes('/') ? f.path.replace(/\/[^/]+$/, '/') : '/';
        const id = f.path;
        return `
          <div class="event ${openChangeId === id ? 'open' : ''}" data-id="${esc(id)}">
            <div class="event-line">
              <div class="event-dot"></div>
              ${i < changes.length - 1 ? '<div class="event-vline"></div>' : ''}
            </div>
            <div class="card">
              <div class="card-head">
                <div class="fi ${f.ext || 'swift'}">${icons.file}</div>
                <div class="card-info">
                  <div class="name">${esc(f.name)}</div>
                  <div class="path">${esc(dir)}</div>
                </div>
                ${tagHtml(f.status, true)}
              </div>
              <div class="card-diff">
                <div class="diff-box">${renderDiffLines(f.content, 12)}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="view ${currentView === 'changes' ? 'active' : ''}" id="view-changes">
          <div class="hero"><h3><em>${changes.length}</em> 处待提交</h3><p>当前仓库 · 轻点展开 Diff</p></div>
          <div class="stream-wrap">${stream || '<p style="color:var(--ink-3);padding:8px">没有待提交的变更</p>'}</div>
        </div>
      `;
    }

    function renderHistory() {
      const repo = getRepo();
      const items = repo.history.map((h, i) => `
        <div class="hist-item">
          <div class="hist-line">
            <div class="hist-dot"></div>
            ${i < repo.history.length - 1 ? '<div class="hist-vline"></div>' : ''}
          </div>
          <div class="hist-card">
            <div class="hist-rev">r${h.rev}</div>
            <div class="hist-body"><div class="msg">${esc(h.msg)}</div><div class="meta">${esc(h.meta)}</div></div>
          </div>
        </div>
      `).join('');

      return `
        <div class="view ${currentView === 'history' ? 'active' : ''}" id="view-history">
          <div class="hero"><h3>提交历史</h3><p>${repo.name} · r${repo.rev}</p></div>
          <div class="history-list">${items}</div>
        </div>
      `;
    }

    function renderWorkspaceSettings() {
      const repo = getRepo();
      return `
        <div class="view ${currentView === 'settings' ? 'active' : ''}" id="view-settings">
          <div class="hero"><h3>仓库设置</h3><p>${repo.name}</p></div>
          <div class="settings">
            <div class="settings-group">
              <div class="settings-row"><span>SVN 地址</span><span class="val">${repo.url}</span></div>
              <div class="settings-row"><span>当前版本</span><span class="val">r${repo.rev}</span></div>
              <div class="settings-row"><span>本地路径</span><span class="val">~/Documents/${repo.name}</span></div>
            </div>
            <div class="settings-group">
              <div class="settings-row"><span>更新到最新</span><span class="val">›</span></div>
              <div class="settings-row"><span>还原全部变更</span><span class="val">›</span></div>
              <div class="settings-row"><span>移除工作副本</span><span class="val" style="color:var(--del)">›</span></div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      renderTopbar();
      renderRail();

      const main = document.getElementById('mainViews');
      if (screen === 'gallery') {
        main.innerHTML = renderGallery();
        document.getElementById('floatBar').style.display = 'none';
        closeFilePreview();
      } else {
        main.innerHTML = renderBrowse() + renderChanges() + renderHistory() + renderWorkspaceSettings();
        const changes = getChanges(getRepo()).length;
        const showBar = changes && (currentView === 'changes' || currentView === 'browse');
        document.getElementById('floatBar').style.display = showBar ? 'flex' : 'none';
        document.getElementById('floatCount').textContent = changes;
      }

      bindEvents();
      if (previewOpen && selectedFilePath) highlightSelectedFile();
    }

    function highlightSelectedFile() {
      document.querySelectorAll('.file-row[data-path]').forEach(el => {
        el.classList.toggle('selected', el.dataset.path === selectedFilePath);
      });
    }

    function enterRepo(id) {
      screen = 'workspace';
      currentRepoId = id;
      currentView = 'browse';
      browsePath = [];
      browseSearch = '';
      browseFilterChanges = false;
      openChangeId = null;
      closeFilePreview();
      render();
    }

    function backToGallery() {
      screen = 'gallery';
      currentRepoId = null;
      currentView = 'repos';
      closeFilePreview();
      closeSheets();
      render();
    }

    function openFilePreview(fullPath) {
      const repo = getRepo();
      const parts = fullPath.split('/');
      const name = parts.pop();
      const node = getNodeAtPath(repo, fullPath.split('/'));
      if (!node || node.type !== 'file') return;

      selectedFilePath = fullPath;
      previewOpen = true;
      const ext = node.ext || 'swift';

      document.getElementById('previewName').textContent = name;
      document.getElementById('previewPath').textContent = repo.name + '/' + fullPath;
      document.getElementById('previewIcon').className = 'fi ' + ext;
      document.getElementById('previewIcon').innerHTML = ext === 'swift' ? icons.swift : icons.file;

      const tag = document.getElementById('previewTag');
      if (node.status) {
        tag.className = 'tag ' + node.status;
        tag.innerHTML = node.status + `<span class="tag-label">${TAG_LABELS[node.status]}</span>`;
        tag.classList.remove('hidden');
      } else {
        tag.classList.add('hidden');
      }

      document.getElementById('previewMeta').innerHTML = `
        <span>${node.size || '—'}</span>
        <span>r${repo.rev}</span>
        ${node.status ? `<span>${TAG_LABELS[node.status]}</span>` : '<span>无本地变更</span>'}
      `;

      document.getElementById('previewBody').innerHTML = node.content
        ? renderDiffLines(node.content, 1)
        : '<div class="diff-line ctx"><span class="diff-ln"></span><span class="diff-code">（二进制或空文件）</span></div>';

      const actions = document.getElementById('previewActions');
      if (node.status) {
        actions.innerHTML = `
          <button type="button" id="btnRevertFile">还原此文件</button>
          <button type="button" class="primary" id="btnGoChanges">查看变更 Diff</button>
        `;
      } else {
        actions.innerHTML = `<button type="button" style="flex:1" id="previewClose2">关闭</button>`;
      }

      document.getElementById('previewBackdrop').classList.add('open');
      document.getElementById('filePreview').classList.add('open');
      highlightSelectedFile();
      bindPreviewActions();
    }

    function closeFilePreview() {
      previewOpen = false;
      selectedFilePath = null;
      document.getElementById('previewBackdrop')?.classList.remove('open');
      document.getElementById('filePreview')?.classList.remove('open');
      highlightSelectedFile();
    }

    function bindPreviewActions() {
      document.getElementById('previewClose')?.addEventListener('click', closeFilePreview);
      document.getElementById('previewClose2')?.addEventListener('click', closeFilePreview);
      document.getElementById('btnRevertFile')?.addEventListener('click', () => {
        toast('已还原 ' + document.getElementById('previewName').textContent);
        closeFilePreview();
      });
      document.getElementById('btnGoChanges')?.addEventListener('click', () => {
        closeFilePreview();
        currentView = 'changes';
        openChangeId = selectedFilePath;
        render();
      });
    }

    function openRepoSheet() {
      if (screen === 'gallery') return;
      const list = document.getElementById('repoSwitchList');
      list.innerHTML = Object.values(REPOS).map(r => {
        const ch = getChanges(r).length;
        return `
        <div class="repo-switch-item ${r.id === currentRepoId ? 'active' : ''}" data-repo="${r.id}">
          <div class="rs-icon">${icons.repo}</div>
          <div class="rs-body">
            <div class="rs-name">${r.name}</div>
            <div class="rs-url">${r.url} · r${r.rev}${ch ? ' · ' + ch + ' 变更' : ''}</div>
          </div>
          ${r.id === currentRepoId ? '<span class="rs-check">✓</span>' : ''}
        </div>`;
      }).join('');
      document.getElementById('sheetBg').classList.add('open');
      document.getElementById('repoSheet').classList.add('open');
      list.querySelectorAll('[data-repo]').forEach(el => {
        el.addEventListener('click', () => {
          closeSheets();
          if (el.dataset.repo !== currentRepoId) {
            enterRepo(el.dataset.repo);
            toast('已切换到 ' + REPOS[el.dataset.repo].name);
          }
        });
      });
    }

    function openCommitSheet() {
      const repo = getRepo();
      const changes = getChanges(repo);
      document.getElementById('commitSub').textContent = repo.name + ' · revision ' + (repo.rev + 1);
      document.getElementById('sheetFiles').innerHTML = changes.map(f => `
        <label class="sheet-file">
          <input type="checkbox" checked />
          ${tagHtml(f.status, true)}
          ${f.name}
        </label>
      `).join('');
      document.getElementById('commitMsg').value = 'feat: 更新 ' + repo.name;
      document.getElementById('sheetBg').classList.add('open');
      document.getElementById('commitSheet').classList.add('open');
    }

    function closeSheets() {
      document.getElementById('sheetBg').classList.remove('open');
      document.getElementById('repoSheet').classList.remove('open');
      document.getElementById('commitSheet').classList.remove('open');
    }

    function bindEvents() {
      document.getElementById('rail').onclick = e => {
        const btn = e.target.closest('[data-view]');
        if (btn) {
          if (btn.dataset.view !== 'browse') closeFilePreview();
          currentView = btn.dataset.view;
          render();
        }
      };

      document.querySelectorAll('.repo-card[data-repo]').forEach(el => {
        el.addEventListener('click', () => enterRepo(el.dataset.repo));
      });
      document.getElementById('btnAddRepo')?.addEventListener('click', () => toast('Checkout 新仓库（演示）'));

      const searchEl = document.getElementById('browseSearch');
      if (searchEl) {
        searchEl.oninput = e => {
          browseSearch = e.target.value;
          render();
          const s = document.getElementById('browseSearch');
          if (s) { s.focus(); const len = s.value.length; s.setSelectionRange(len, len); }
        };
        searchEl.onkeydown = e => e.stopPropagation();
      }
      document.getElementById('filterChanges')?.addEventListener('click', () => {
        browseFilterChanges = !browseFilterChanges;
        render();
      });

      document.getElementById('breadcrumb')?.addEventListener('click', e => {
        const c = e.target.closest('.crumb');
        if (c && c.dataset.path) {
          browsePath = JSON.parse(c.dataset.path);
          closeFilePreview();
          render();
        }
      });

      document.getElementById('fileList')?.addEventListener('click', e => {
        const row = e.target.closest('.file-row');
        if (!row) return;
        if (row.dataset.action === 'folder') {
          browsePath = [...browsePath, row.dataset.name];
          closeFilePreview();
          render();
        } else if (row.dataset.action === 'file') {
          openFilePreview(row.dataset.path);
        }
      });

      document.querySelectorAll('.event').forEach(el => {
        el.addEventListener('click', () => {
          openChangeId = openChangeId === el.dataset.id ? null : el.dataset.id;
          render();
        });
      });
    }

    document.getElementById('btnBack').addEventListener('click', backToGallery);
    document.getElementById('repoPicker').addEventListener('click', () => {
      if (screen === 'workspace') openRepoSheet();
    });
    document.getElementById('sheetBg').addEventListener('click', closeSheets);
    document.getElementById('previewBackdrop').addEventListener('click', closeFilePreview);
    document.getElementById('btnUpdate').addEventListener('click', () => {
      const pill = document.getElementById('syncPill');
      document.getElementById('app').classList.add('syncing');
      pill.textContent = '同步中…';
      setTimeout(() => {
        document.getElementById('app').classList.remove('syncing');
        toast('✓ ' + getRepo().name + ' 已更新到 r' + getRepo().rev);
        renderTopbar();
      }, 1200);
    });
    document.getElementById('btnCommit').addEventListener('click', openCommitSheet);
    document.getElementById('btnSubmit').addEventListener('click', () => {
      const repo = getRepo();
      closeSheets();
      repo.rev += 1;
      toast('✓ 已提交到 r' + repo.rev);
      render();
    });

    render();
  </script>
</body>
</html>
